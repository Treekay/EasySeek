<!doctype html><html lang="en"><meta charset="utf-8"><title>EasySeek DOM tests</title>
<link rel="stylesheet" href="../src/styles.css">
<main><section id="results">
<article><h2><a data-automation="jobTitle" href="https://nz.seek.com/job/12345678?tracking=x">Full-Stack Engineer</a></h2><span data-automation="jobCompany">Xero Limited</span><span data-automation="jobLocation">Auckland Central</span></article>
</section><section id="detail" data-job-id="12345678"><h1 data-automation="job-detail-title">Full-Stack Engineer</h1><span data-automation="advertiser-name">Xero Limited</span><span data-automation="job-detail-location">Auckland Central</span><div data-automation="jobAdDetails"><p>First paragraph</p><p>Final paragraph of the full description</p></div></section></main>
<pre id="report">RUNNING</pre>
<script src="../src/state.js"></script><script src="../src/seek-extractor.js"></script>
<script>
let records = [], preferences = EasySeekState.preferences();
const listeners = [];
globalThis.chrome = { runtime: { async sendMessage(message) {
  if (message.type === 'action') records = EasySeekState.apply(records, message.job, message.action);
  if (message.type === 'observe') for (const job of message.jobs) records = EasySeekState.apply(records, job, 'OBSERVE');
  if (message.type === 'preferences') Object.assign(preferences, message.preferences);
  return { ok: true, records, preferences };
} }, storage: { onChanged: { addListener(fn) { listeners.push(fn); } } } };
</script>
<script src="../src/storage.js"></script><script src="../src/ui.js"></script><script src="../src/content.js"></script>
<script>
const pause = () => new Promise(resolve => setTimeout(resolve, 350));
const assert = (condition, message) => { if (!condition) throw new Error(message); };
(async () => {
  await pause();
  const card = document.querySelector('article'), S = EasySeekState;
  const filter = key => document.querySelector(`[data-filter="${key}"]`);
  const isHidden = () => card.classList.contains('easyseek-hidden');
  const choose = async (root, mark) => {
    root.querySelector('summary').click();
    assert(root.querySelector('details').open, 'menu opens');
    root.querySelector(`[data-mark="${mark}"]`).click(); await pause();
    assert(!root.querySelector('details').open, 'menu closes after selection');
  };
  assert(card.querySelector('summary').textContent === 'Mark', 'single unmarked control');
  assert(!isHidden(), 'new visible');
  const detail = EasySeekExtractor.detail(document, 'https://nz.seek.com/job/12345678?x=1');
  assert(detail.job.url === 'https://nz.seek.com/job/12345678', 'production canonical detail URL');
  assert(EasySeekExtractor.cards().get(card).url === detail.job.url, 'production card canonical URL');
  assert(EasySeekExtractor.detail(document, 'https://nz.seek.com/engineer-jobs?jobId=12345678').job.id === detail.job.id, 'production split search detail');
  for (const origin of ['https://seek.co.nz', 'https://www.seek.co.nz']) {
    assert(EasySeekExtractor.detail(document, origin + '/job/12345678').job.url === detail.job.url, 'legacy detail canonical URL');
  }
  const unrelated = document.createElement('article');
  unrelated.innerHTML = '<a href="https://example.com/job/12345678">Unrelated job</a>';
  document.querySelector('#results').append(unrelated);
  assert(!EasySeekExtractor.cards().has(unrelated), 'unrelated card rejected');
  unrelated.remove();
  assert(detail.job.description.includes('Final paragraph'), 'detail detection');
  records = S.apply(records, detail.job, 'VIEW');
  listeners.forEach(fn => fn({ records: { newValue: records } }, 'local')); await pause();
  assert(!isHidden() && card.querySelector('.easyseek-viewed').textContent === 'Viewed', 'viewed visible by default');
  filter('hideViewed').click(); await pause(); assert(isHidden(), 'hide viewed');
  filter('showHidden').click(); await pause(); assert(!isHidden(), 'show hidden override');
  await choose(card, 'SAVED'); assert(S.getState(records, detail.job).mark === 'SAVED', 'saved');
  filter('hideViewed').click(); filter('showHidden').click(); await pause();
  assert(!isHidden() && card.classList.contains('easyseek-saved'), 'saved highlighted');
  filter('hideSaved').click(); await pause(); assert(isHidden(), 'hide saved');
  filter('showHidden').click(); await pause(); await choose(card, 'APPLIED');
  filter('showHidden').click(); await pause(); assert(!isHidden(), 'applied visible by default');
  filter('hideApplied').click(); await pause(); assert(isHidden(), 'hide applied');
  filter('showHidden').click(); await pause(); await choose(card, 'SKIP');
  filter('showHidden').click(); await pause(); assert(isHidden(), 'skip hidden by default');
  filter('showHidden').click(); await pause(); await choose(card, 'NONE');
  filter('showHidden').click(); await pause(); assert(!isHidden(), 'clear mark keeps viewed and unhides');
  assert(S.getState(records, detail.job).viewed, 'clear mark preserves view');
  await choose(card, 'SAVED'); filter('hideSaved').click(); await pause();
  card.querySelector('summary').click();
  card.querySelector('details').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  assert(!card.querySelector('details').open, 'Escape closes');
  card.querySelector('summary').click(); document.body.click(); assert(!card.querySelector('details').open, 'outside click closes');
  const clone = card.cloneNode(true); clone.querySelector('.easyseek-actions').remove();
  clone.querySelector('a').href = 'https://www.seek.co.nz/job/99999999';
  document.querySelector('#results').append(clone); await pause();
  assert(clone.querySelector('summary').textContent === 'Saved', 'dynamic alias recognized');
  const malformed = document.createElement('article'); malformed.innerHTML = '<a href="/job/nope">Bad card</a>';
  document.querySelector('#results').append(malformed); await pause();
  assert(!malformed.querySelector('.easyseek-actions'), 'malformed ignored');
  const markedAt = records[0].markChangedAt;
  history.pushState({}, '', '?jobId=12345678'); window.dispatchEvent(new PopStateEvent('popstate')); await pause(); await pause();
  assert(S.getState(records, detail.job).mark === 'SAVED', 'opening preserves mark');
  assert(records[0].markChangedAt === markedAt, 'opening preserves mark date');
  const detailRoot = document.querySelector('#detail');
  await choose(detailRoot, 'NONE');
  assert(S.getState(records, detail.job).viewed, 'detail clear keeps history');
  assert(![...document.querySelectorAll('button')].some(button => button.textContent.includes('Career Ops')), 'Career Ops removed');
  const lastViewed = records[0].lastViewedAt;
  history.pushState({}, '', '?jobId=12345678&tracking=changed'); window.dispatchEvent(new PopStateEvent('popstate')); await pause();
  assert(records[0].lastViewedAt === lastViewed, 'tracking-only changes do not view again');
  history.pushState({}, '', '?search=again'); window.dispatchEvent(new PopStateEvent('popstate')); await pause();
  history.pushState({}, '', '?jobId=12345678'); window.dispatchEvent(new PopStateEvent('popstate')); await pause(); await pause();
  assert(records[0].lastViewedAt > lastViewed, 'reopening updates viewed date');
  history.pushState({}, '', '?jobId=88888888'); window.dispatchEvent(new PopStateEvent('popstate')); await pause();
  assert(!records.some(r => r.seekIds.includes('88888888')), 'stale detail not viewed under new ID');
  detailRoot.dataset.jobId = '88888888'; detailRoot.querySelector('h1').textContent = 'Different Engineer';
  detailRoot.querySelector('[data-automation="jobAdDetails"]').textContent = 'A new description'; await pause(); await pause();
  assert(records.some(r => r.seekIds.includes('88888888') && r.lastViewedAt !== null), 'SPA detail records view');
  document.querySelector('#report').textContent = 'PASS: mark menu, keyboard dismissal, all filters, Show Hidden, independent viewed history, dynamic aliases, malformed cards, SPA navigation, no Career Ops';
})().catch(error => document.querySelector('#report').textContent = 'FAIL: ' + error.stack);
</script></html>
