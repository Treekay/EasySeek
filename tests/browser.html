<!doctype html><html lang="en"><meta charset="utf-8"><title>EasySeek DOM tests</title>
<link rel="stylesheet" href="../src/styles.css">
<main><section id="results">
<article><h2><a data-automation="jobTitle" href="https://nz.seek.com/job/12345678?tracking=x">Full-Stack Engineer</a></h2><span data-automation="jobCompany">Xero Limited</span><span data-automation="jobLocation">Auckland Central</span></article>
</section><section id="detail" data-job-id="12345678"><h1 data-automation="job-detail-title">Full-Stack Engineer</h1><span data-automation="advertiser-name">Xero Limited</span><span data-automation="job-detail-location">Auckland Central</span><div data-automation="jobAdDetails"><p>First paragraph</p><p>Final paragraph of the full description</p></div></section></main>
<pre id="report">RUNNING</pre>
<script src="../src/state.js"></script><script src="../src/seek-extractor.js"></script>
<script>
let records = [], preferences = EasySeekState.preferences(), memoryOpened = 0;
const listeners = [];
globalThis.chrome = { runtime: { async sendMessage(message) {
  if (message.type === 'action') records = EasySeekState.apply(records, message.job, message.action);
  if (message.type === 'observe') for (const job of message.jobs) records = EasySeekState.apply(records, job, 'OBSERVE');
  if (message.type === 'preferences') Object.assign(preferences, message.preferences);
  if (message.type === 'openOptions') memoryOpened++;
  return { ok: true, records, preferences };
} }, storage: { onChanged: { addListener(fn) { listeners.push(fn); } } } };
</script>
<script src="../src/storage.js"></script><script src="../src/jd.js"></script><script src="../src/ui.js"></script><script src="../src/content.js"></script>
<script>
const pause = () => new Promise(resolve => setTimeout(resolve, 350));
const assert = (condition, message) => { if (!condition) throw new Error(message); };
(async () => {
  await pause();
  const card = document.querySelector('article'), S = EasySeekState;
  const rail = document.querySelector('.easyseek-rail');
  const button = action => rail.querySelector(`[data-action="${action}"]`);
  const menu = key => document.querySelector('#easyseek-' + key + '-menu');
  const navigate = async url => { history.pushState({}, '', url); window.dispatchEvent(new PopStateEvent('popstate')); await pause(); await pause(); };
  assert(rail && getComputedStyle(rail).position === 'fixed', 'fixed rail');
  const rect = rail.getBoundingClientRect();
  assert(Math.abs(rect.top + rect.height / 2 - innerHeight / 2) < 2 && innerWidth - rect.right < 20, 'right middle position');
  assert(rail.querySelectorAll('.easyseek-main').length === 4, 'four main buttons');
  assert(!document.querySelector('article [data-easyseek-ui], #detail [data-easyseek-ui], .easyseek-controls, .easyseek-actions'), 'no inline controls');
  for (const action of ['copy', 'export', 'mark']) assert(button(action).disabled, 'no detail disables ' + action);
  assert(!button('filter').disabled, 'filter available without detail');
  const detail = EasySeekExtractor.detail(document, 'https://nz.seek.com/job/12345678?x=1');
  assert(detail.job.url === 'https://nz.seek.com/job/12345678', 'canonical detail URL');
  assert(EasySeekExtractor.cards().get(card).url === detail.job.url, 'canonical card URL');
  for (const origin of ['https://seek.co.nz', 'https://www.seek.co.nz']) assert(EasySeekExtractor.detail(document, origin + '/job/12345678').job.id === detail.job.id, 'legacy detail');
  await navigate('?jobId=12345678');
  assert(!button('copy').disabled && S.getState(records, detail.job).viewed, 'split detail active and viewed');
  button('mark').click();
  assert(!menu('mark').hidden && menu('mark').getBoundingClientRect().right < button('mark').getBoundingClientRect().left, 'mark menu expands left');
  const widths = [...menu('mark').children].map(node => node.getBoundingClientRect().width);
  assert(widths.every(width => width === widths[0]), 'equal mark buttons');
  button('mark-SAVED').click(); await pause();
  assert(menu('mark').hidden && button('mark').dataset.mark === 'SAVED' && button('mark').querySelector('svg'), 'mark selection collapses and reflects mark');
  assert(card.classList.contains('easyseek-saved'), 'saved card subtle highlight');
  const markedAt = records[0].markChangedAt;
  await navigate('?search=again'); await navigate('?jobId=12345678');
  assert(records[0].markChangedAt === markedAt && records[0].mark === 'SAVED', 'opening preserves mark');
  button('filter').click();
  assert(button('export').querySelector('svg'), 'export icon');
  assert(button('hideSkipped').getAttribute('aria-pressed') === 'false', 'Skip initially not selected');
  for (const key of ['hideApplied', 'hideSaved', 'hideViewed']) assert(button(key).getAttribute('aria-pressed') === 'true', 'shown type selected');
  assert(!rail.querySelector('[data-action="showHidden"]'), 'no Show Hidden control');
  button('hideSaved').click(); await pause();
  assert(!menu('filter').hidden && preferences.hideSaved && card.classList.contains('easyseek-hidden'), 'filter stays open and persists');
  assert(button('hideSaved').getAttribute('aria-pressed') === 'false', 'unselected Saved hidden');
  button('hideSaved').click(); await pause(); assert(!card.classList.contains('easyseek-hidden'), 'select Saved restores job');
  button('memory').click(); await pause(); assert(memoryOpened === 1, 'Memory access');
  button('hideViewed').click(); await pause(); assert(preferences.hideViewed, 'viewed toggle');
  button('hideApplied').click(); await pause(); assert(preferences.hideApplied, 'applied toggle');
  button('hideSkipped').click(); await pause(); assert(!preferences.hideSkipped, 'skip toggle');
  button('hideViewed').click(); await pause(); button('hideApplied').click(); await pause();
  assert(S.filterKeys.every(key => !preferences[key]), 'all selected shows every type');
  rail.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); assert(menu('filter').hidden, 'Escape closes');
  button('filter').click(); document.body.click(); assert(menu('filter').hidden, 'outside click closes');
  let copied = '', exported = null, downloaded = '';
  Object.defineProperty(navigator, 'clipboard', { configurable: true, value: { async writeText(value) { copied = value; } } });
  URL.createObjectURL = blob => { exported = blob; return 'blob:test-download'; };
  const originalClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () { if (this.download) downloaded = this.download; else originalClick.call(this); };
  button('copy').click(); await pause();
  assert(copied.includes('Final paragraph') && copied.includes('**SEEK Job ID:** 12345678') && copied.includes('https://nz.seek.com/job/12345678'), 'copy full structured markdown');
  assert(document.querySelector('.easyseek-feedback').textContent === 'Copied', 'copy feedback');
  button('export').click(); await pause();
  assert(await exported.text() === copied && downloaded === 'xero-limited-full-stack-engineer-12345678.md', 'export same markdown and safe filename');
  assert(!records.some(record => 'description' in record), 'no JD persistence');
  navigator.clipboard.writeText = async () => { throw new Error('denied'); };
  button('copy').click(); await pause(); assert(document.querySelector('.easyseek-feedback').textContent.includes('Could not copy'), 'copy failure feedback');
  const clone = card.cloneNode(true); clone.querySelector('a').href = 'https://www.seek.co.nz/job/99999999';
  document.querySelector('#results').append(clone); await pause();
  assert(clone.classList.contains('easyseek-saved') && !clone.querySelector('button'), 'dynamic alias without controls');
  const malformed = document.createElement('article'); malformed.innerHTML = '<a href="https://example.com/job/1">Bad card</a>';
  document.querySelector('#results').append(malformed); await pause(); assert(!EasySeekExtractor.cards().has(malformed), 'unrelated ignored');
  await navigate('?jobId=88888888'); assert(button('copy').disabled && button('mark').disabled, 'stale detail disabled');
  assert(!records.some(record => record.seekIds.includes('88888888')), 'stale detail not viewed');
  const detailRoot = document.querySelector('#detail'); detailRoot.dataset.jobId = '88888888'; detailRoot.querySelector('h1').textContent = 'Different Engineer';
  detailRoot.querySelector('[data-automation="jobAdDetails"]').textContent = 'New description'; await pause(); await pause();
  assert(!button('copy').disabled && records.some(record => record.seekIds.includes('88888888')), 'SPA new detail enabled');
  // Simulate a standalone route through the real extractor, independent of file:// fixture routing.
  const extract = EasySeekExtractor.detail;
  EasySeekExtractor.detail = () => extract(document, 'https://nz.seek.com/job/88888888');
  await navigate('?full-detail'); assert(!button('mark').disabled, 'full detail active');
  button('mark').click(); button('mark-APPLIED').click(); await pause();
  assert(records.some(record => record.seekIds.includes('88888888') && record.mark === 'APPLIED'), 'full detail mark');
  EasySeekExtractor.detail = extract;
  await navigate('?no-detail'); for (const action of ['copy', 'export', 'mark']) assert(button(action).disabled, 'leaving detail disables ' + action);
  assert(document.querySelectorAll('.easyseek-rail').length === 1, 'single rail across SPA changes');
  document.querySelector('#report').textContent = 'PASS: floating placement, no inline controls, left menus, marks, positive visibility filters, copy/export Markdown, disabled/stale contexts, aliases, SPA, full detail, Memory access';
})().catch(error => document.querySelector('#report').textContent = 'FAIL: ' + error.stack);
</script></html>
