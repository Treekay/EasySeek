<!doctype html><html lang="en"><meta charset="utf-8"><title>EasySeek DOM tests</title>
<link rel="stylesheet" href="../src/styles.css">
<main><section id="results">
<article><h2><a data-automation="jobTitle" href="https://www.seek.co.nz/job/12345678?tracking=x">Full-Stack Engineer</a></h2><span data-automation="jobCompany">Xero Limited</span><span data-automation="jobLocation">Auckland Central</span></article>
</section><section id="detail" data-job-id="12345678"><h1 data-automation="job-detail-title">Full-Stack Engineer</h1><span data-automation="advertiser-name">Xero Limited</span><span data-automation="job-detail-location">Auckland Central</span><div data-automation="jobAdDetails"><p>First paragraph</p><p>Final paragraph of the full description</p></div></section></main>
<pre id="report">RUNNING</pre>
<script src="../src/state.js"></script><script src="../src/seek-extractor.js"></script>
<script>
let records = [], preferences = { hideSeen: true, hideSkipped: true };
const listeners = [];
globalThis.chrome = { runtime: { async sendMessage(message) {
  if (message.type === 'action') records = EasySeekState.apply(records, message.job, message.action);
  if (message.type === 'observe') for (const job of message.jobs) records = EasySeekState.apply(records, job, 'OBSERVE');
  if (message.type === 'preferences') Object.assign(preferences, message.preferences);
  return { ok: true, records, preferences };
} }, storage: { onChanged: { addListener(fn) { listeners.push(fn); } } } };
</script>
<script src="../src/storage.js"></script><script src="../src/ui.js"></script><script src="../src/content.js"></script>
<script>
const pause = () => new Promise(resolve => setTimeout(resolve, 350));
const assert = (condition, message) => { if (!condition) throw new Error(message); };
(async () => {
  await pause();
  const card = document.querySelector('article');
  assert(card.querySelector('.easyseek-actions'), 'card actions');
  assert(!card.classList.contains('easyseek-hidden'), 'NEW visible');
  const detail = EasySeekExtractor.detail(document, 'https://www.seek.co.nz/job/12345678?x=1');
  assert(detail.job.description.includes('Final paragraph'), 'full detail extraction');
  records = EasySeekState.apply(records, detail.job, 'SEEN');
  listeners.forEach(fn => fn({ records: { newValue: records } }, 'local'));
  await pause();
  assert(card.classList.contains('easyseek-hidden'), 'SEEN hidden');
  const show = [...document.querySelectorAll('.easyseek-controls input')][2];
  show.click(); await pause();
  assert(!card.classList.contains('easyseek-hidden'), 'Show Hidden restores');
  assert(card.querySelector('.easyseek-badge').textContent === 'SEEN', 'SEEN badge');
  const action = label => [...card.querySelectorAll('button')].find(b => b.textContent === label).click();
  action('Reset'); await pause();
  assert(EasySeekState.status(records, detail.job) === 'NEW', 'Reset clears');
  show.click(); action('Skip'); await pause();
  assert(card.classList.contains('easyseek-hidden'), 'SKIP hidden');
  show.click(); await pause(); action('Pursue'); await pause(); show.click(); await pause();
  assert(!card.classList.contains('easyseek-hidden') && card.classList.contains('easyseek-pursue'), 'PURSUE visible');
  const clone = card.cloneNode(true); clone.querySelector('.easyseek-actions').remove();
  clone.querySelector('a').href = 'https://www.seek.co.nz/job/99999999';
  document.querySelector('#results').append(clone); await pause();
  assert(clone.querySelector('.easyseek-badge').textContent === 'PURSUE', 'dynamic repost recognized');
  const malformed = document.createElement('article'); malformed.innerHTML = '<a href="/job/nope">Bad card</a>';
  document.querySelector('#results').append(malformed); await pause();
  assert(!malformed.querySelector('.easyseek-actions'), 'malformed card ignored');
  // Exercise SPA detail entry, manual Reset, tracking-only changes, and return to search.
  history.pushState({}, '', '?jobId=12345678');
  window.dispatchEvent(new PopStateEvent('popstate')); await pause(); await pause();
  assert(document.querySelector('#detail .easyseek-actions'), 'detail actions mounted');
  assert(EasySeekState.status(records, detail.job) === 'PURSUE', 'opening preserves PURSUE');
  const detailAction = label => [...document.querySelectorAll('#detail button')].find(b => b.textContent === label).click();
  detailAction('Reset'); await pause();
  assert(EasySeekState.status(records, detail.job) === 'NEW', 'detail reset stays NEW');
  history.pushState({}, '', '?jobId=12345678&tracking=changed');
  window.dispatchEvent(new PopStateEvent('popstate')); await pause();
  assert(EasySeekState.status(records, detail.job) === 'NEW', 'tracking-only navigation preserves reset');
  let copied = '';
  Object.defineProperty(navigator, 'clipboard', { value: { async writeText(value) { copied = value; } }, configurable: true });
  detailAction('Analyze with Career Ops'); await pause();
  assert(copied.includes('Final paragraph') && copied.includes('## Analysis Request'), 'clipboard handoff');
  navigator.clipboard.writeText = async () => { throw new Error('Permission denied'); };
  detailAction('Analyze with Career Ops'); await pause();
  assert(document.querySelector('.easyseek-feedback').textContent.includes('Could not copy'), 'clipboard failure feedback');
  history.pushState({}, '', '?search=again');
  window.dispatchEvent(new PopStateEvent('popstate')); await pause();
  history.pushState({}, '', '?jobId=12345678');
  window.dispatchEvent(new PopStateEvent('popstate')); await pause(); await pause();
  assert(EasySeekState.status(records, detail.job) === 'SEEN', 'reopening reset job becomes SEEN');
  assert(card.classList.contains('easyseek-hidden'), 'return search filtering updates');
  history.pushState({}, '', '?jobId=88888888');
  window.dispatchEvent(new PopStateEvent('popstate')); await pause();
  assert(!records.some(r => r.seekIds.includes('88888888')), 'stale detail is not saved under new ID');
  document.querySelector('#detail').dataset.jobId = '88888888';
  document.querySelector('#detail h1').textContent = 'Different Engineer';
  document.querySelector('[data-automation="jobAdDetails"]').textContent = 'A new job description';
  await pause(); await pause();
  assert(records.some(r => r.seekIds.includes('88888888') && r.status === 'SEEN'), 'loaded SPA detail becomes SEEN');
  document.querySelector('#report').textContent = 'PASS: extraction, NEW, SEEN, Show Hidden, Reset, SKIP, PURSUE, dynamic repost, malformed card, SPA navigation, detail reset, clipboard handoff';
})().catch(error => document.querySelector('#report').textContent = 'FAIL: ' + error.stack);
</script></html>
