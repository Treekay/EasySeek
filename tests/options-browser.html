<!doctype html><html lang="en"><meta charset="utf-8"><title>EasySeek options tests</title>
<pre id="report">RUNNING</pre><iframe title="Options page" style="width:100%;height:1100px;border:0"></iframe>
<script src="../src/state.js"></script>
<script>
const S = EasySeekState;
let records = [], preferences = S.preferences();
var confirmations = [], allowConfirm = false;
for (const [index, status] of ['VIEW', 'SKIP', 'SAVED'].entries()) {
  records = S.apply(records, { id: String(index + 1), title: ['Engineer', 'Designer', '<img src=x onerror=alert(1)>'][index], company: 'Example Ltd', location: 'Auckland' }, status, Date.now() - (index + 1) * S.DAY);
}
globalThis.mockChrome = { runtime: { async sendMessage(message) {
  if (message.type === 'manage') records = S.manage(records, message.key, message.action);
  if (message.type === 'preferences') preferences = S.preferences({ ...preferences, ...message.preferences });
  if (message.type === 'bulk') {
    if (!message.confirmed) throw new Error('Missing confirmation');
    if (message.action !== 'EXPIRED') throw new Error('Invalid cleanup action');
  }
  records = S.cleanup(records, Date.now(), preferences);
  return { ok: true, records, preferences };
} }, storage: { onChanged: { addListener() {} } } };
const pause = () => new Promise(resolve => setTimeout(resolve, 150));
const assert = (value, message) => { if (!value) throw new Error(message); };
(async () => {
  const html = await (await fetch('../options/options.html')).text();
  const frame = document.querySelector('iframe');
  frame.srcdoc = html.replace('<head>', '<head><base href="' + new URL('../options/', location.href).href + '"><script>globalThis.chrome = parent.mockChrome; globalThis.confirm = message => { parent.confirmations.push(message); return parent.allowConfirm; };<\/script>');
  await new Promise(resolve => frame.onload = resolve); await pause();
  const doc = frame.contentDocument, win = frame.contentWindow;
  const $ = id => doc.getElementById(id);
  assert(doc.querySelectorAll('.record').length === 3, 'all remembered records');
  assert(doc.querySelector('h3').textContent === 'Engineer', 'newest mark first');
  assert(!doc.querySelector('.record img'), 'stored text is not interpreted as HTML');
  $('search').value = 'designer'; $('search').dispatchEvent(new win.Event('input'));
  assert(doc.querySelectorAll('.record').length === 1, 'search');
  $('search').value = ''; $('filter').value = 'SAVED'; $('filter').dispatchEvent(new win.Event('change'));
  assert(doc.querySelectorAll('.record').length === 1 && doc.querySelector('.dates').textContent.includes('Never'), 'mark filter and expiry');
  const row = doc.querySelector('.record'); row.querySelector('.stage-select').value = 'APPLIED'; row.querySelector('.stage-save').click(); await pause();
  assert(records.find(record => record.seekIds.includes('3')).applicationStage === 'APPLIED', 'manual mark update');
  assert(doc.querySelectorAll('.record').length === 1, 'Saved stays independent of application stage');
  $('filter').value = ''; $('viewedFilter').value = 'yes'; $('viewedFilter').dispatchEvent(new win.Event('change'));
  assert(doc.querySelectorAll('.record').length === 1 && doc.querySelector('h3').textContent === 'Engineer', 'viewed filter independent');
  const viewedRow = doc.querySelector('.record'); viewedRow.querySelector('select').value = 'SAVED'; viewedRow.querySelector('button').click(); await pause();
  assert(records.find(record => record.seekIds.includes('1')).lastViewedAt !== null, 'mark keeps last viewed');
  doc.querySelector('.record select').value = 'NONE'; doc.querySelector('.record button').click(); await pause();
  assert(doc.querySelectorAll('.record').length === 1, 'clear mark retains viewed row');
  doc.querySelector('.record button:last-child').click(); await pause();
  assert(records.length === 3 && confirmations.length === 1, 'remove cancellation');
  allowConfirm = true; doc.querySelector('.record button:last-child').click(); await pause();
  assert(records.length === 2, 'remove confirmed');
  $('viewedFilter').value = ''; $('viewedFilter').dispatchEvent(new win.Event('change'));
  $('viewedDays').value = 'never'; $('skipDays').value = '90'; $('savedDays').value = '30';
  $('hideApplied').checked = false;
  $('settings').dispatchEvent(new win.Event('submit', { cancelable: true })); await pause();
  assert(preferences.viewedDays === null && preferences.skipDays === 90 && preferences.savedDays === 30 && preferences.appliedDays === null && preferences.hideApplied, 'browsing retentions and filters saved; applications never expire');
  const count = confirmations.length;
  allowConfirm = false; $('cleanup').click(); await pause();
  assert(confirmations.length === count + 1 && records.length === 2, 'cleanup cancellation');
  allowConfirm = true; $('cleanup').click(); await pause();
  assert(records.length === 2, 'cleanup keeps unexpired marks');
  records = S.apply(records, { platform: 'linkedin', id: '1', title: 'LinkedIn Engineer', company: 'Example', location: 'Auckland' }, 'SAVED');
  $('refresh').click(); await pause();
  $('search').value = 'LinkedIn'; $('search').dispatchEvent(new win.Event('input'));
  assert(doc.querySelectorAll('.record').length === 1 && doc.querySelector('.record').textContent.includes('LinkedIn IDs: 1'), 'LinkedIn record rendered with correct source');
  doc.querySelector('.record .stage-select').value = 'APPLIED'; doc.querySelector('.record .stage-save').click(); await pause();
  assert(records.find(record => record.platform === 'linkedin').applicationStage === 'APPLIED', 'LinkedIn management action');
  doc.querySelector('.record .stage-select').value = 'INTERVIEW'; doc.querySelector('.record .stage-save').click(); await pause();
  doc.querySelector('.record .stage-select').value = 'OFFERED'; doc.querySelector('.record .stage-save').click(); await pause();
  assert(doc.querySelector('.record').textContent.includes('INTERVIEW:') && doc.querySelector('.record a').href === 'https://www.linkedin.com/jobs/view/1/', 'stage dates and source URL');
  assert(doc.querySelectorAll('.record details li').length === 3, 'full history visible');
  $('search').value = ''; $('view').value = 'applications'; $('view').dispatchEvent(new win.Event('change'));
  assert(doc.querySelectorAll('.record').length === 2, 'applications view excludes Skip and Viewed-only');
  $('filter').value = 'OFFERED'; $('filter').dispatchEvent(new win.Event('change'));
  assert(doc.querySelectorAll('.record').length === 1, 'application stage filter');
  let csvBlob, csvName;
  win.URL.createObjectURL = blob => { csvBlob = blob; return 'blob:fixture'; };
  win.HTMLAnchorElement.prototype.click = function () { csvName = this.download; };
  const before = JSON.stringify(records);
  $('exportApplications').click(); await pause();
  const bytes = new Uint8Array(await csvBlob.arrayBuffer());
  assert(bytes[0] === 239 && bytes[1] === 187 && bytes[2] === 191, 'CSV UTF-8 BOM');
  const csv = await csvBlob.text();
  assert(csv.includes('OFFERED') && csv.includes('APPLIED') && csv.includes('LinkedIn Engineer') && csv.includes('<img src=x onerror=alert(1)>'), 'export all applications independent of filter');
  assert(/^easyseek-applications-\d{4}-\d{2}-\d{2}\.csv$/.test(csvName), 'CSV filename');
  assert(JSON.stringify(records) === before, 'CSV does not modify storage');
  doc.querySelector('.record .stage-select').value = 'NONE'; doc.querySelector('.record .stage-save').click(); await pause();
  $('filter').value = ''; $('filter').dispatchEvent(new win.Event('change'));
  assert(records.find(record => record.platform === 'linkedin').applicationHistory.at(-1).stage === 'NONE', 'reset stage keeps historical events');
  document.querySelector('#report').textContent = 'PASS: options rendering, sorting, search, filter, safe text, independent viewed filter, expiry, marks, clear mark, remove confirmation, three retention settings, never-expiring application history, application filters and CSV export, cleanup confirmation';
})().catch(error => document.querySelector('#report').textContent = 'FAIL: ' + error.stack);
</script></html>
