<!doctype html><html lang="en"><meta charset="utf-8"><title>LinkedIn adapter fixture</title>
<link rel="stylesheet" href="../src/styles.css">
<main><ul id="results"><li data-occludable-job-id="123" class="jobs-search-results__list-item"><div class="job-card-container"><a class="job-card-list__title" href="https://www.linkedin.com/jobs/view/123/?tracking=abc"><span aria-hidden="true">Full-Stack Engineer</span><span class="visually-hidden">Full-Stack Engineer</span></a><div class="artdeco-entity-lockup__subtitle">Xero Limited</div><div class="job-card-container__metadata-item">Auckland Central</div></div></li></ul>
<section id="detail" data-job-id="123"><div class="job-details-jobs-unified-top-card__job-title"><h1><a href="https://www.linkedin.com/jobs/view/123/">Full-Stack Engineer</a></h1></div><div class="job-details-jobs-unified-top-card__company-name">Xero Limited</div><div class="job-details-jobs-unified-top-card__primary-description-container"><span class="tvm__text">Auckland Central</span> · Reposted 2 days ago · 12 applicants</div><div id="job-details"><p>First paragraph</p><p>Final paragraph of description</p></div></section></main>
<pre id="report">RUNNING</pre>
<script src="../src/state.js"></script><script src="../src/linkedin-extractor.js"></script>
<script>
const S = EasySeekState, E = EasySeekExtractor;
const realDetail = E.detail, realActive = E.active, realRouteId = E.routeId;
// Map local fixture paths onto real LinkedIn routes; extraction and URL validation stay real.
function route(url = location.href) { const params = new URL(url).searchParams; return 'https://www.linkedin.com' + (params.get('path') || '/jobs/search/') + (params.get('id') ? '?currentJobId=' + params.get('id') : ''); }
E.detail = () => realDetail(document, route()); E.active = url => realActive(route(url)); E.routeId = url => realRouteId(route(url));
let records = [], preferences = S.preferences();
const listeners = [];
globalThis.chrome = { runtime: { async sendMessage(message) {
  if (message.type === 'action') records = S.apply(records, message.job, message.action);
  if (message.type === 'observe') for (const job of message.jobs) records = S.apply(records, job, 'OBSERVE');
  if (message.type === 'preferences') Object.assign(preferences, message.preferences);
  return { ok: true, records, preferences };
} }, storage: { onChanged: { addListener(fn) { listeners.push(fn); } } } };
</script>
<script src="../src/storage.js"></script><script src="../src/jd.js"></script><script src="../src/ui.js"></script><script src="../src/content.js"></script>
<script>
const pause = () => new Promise(resolve => setTimeout(resolve, 400));
const assert = (condition, message) => { if (!condition) throw new Error(message); };
(async () => {
  await pause(); await pause();
  const card = document.querySelector('li'), detail = document.querySelector('#detail');
  const job = E.cards().get(card);
  assert(job.id === '123' && job.platform === 'linkedin' && job.title === 'Full-Stack Engineer', 'card extraction without duplicate accessibility text');
  const extracted = realDetail(document, 'https://www.linkedin.com/jobs/search/?currentJobId=123');
  assert(extracted.job.company === 'Xero Limited' && extracted.job.location === 'Auckland Central' && extracted.job.posted === 'Reposted 2 days ago', 'split metadata');
  assert(realDetail(document, 'https://www.linkedin.com/jobs/view/engineer-at-xero-123').job.id === '123', 'standalone slug detail');
  assert(realDetail(document, 'https://www.linkedin.com/jobs/search/?currentJobId=999') === null, 'stale ID evidence rejected');
  const button = key => document.querySelector(`[data-action="${key}"]`);
  // A split-view heading need not be an h1. Empty/stale panels must not
  // prevent the selected detail from enabling all three job actions.
  const title = detail.querySelector('.job-details-jobs-unified-top-card__job-title');
  const originalTitle = title.innerHTML;
  title.innerHTML = '<h2><a href="https://www.linkedin.com/jobs/view/123/">Full-Stack Engineer</a></h2>';
  const placeholders = document.createElement('section');
  placeholders.innerHTML = '<div class="job-details-jobs-unified-top-card__job-title"></div><div class="jobs-description-content__text"></div><div style="visibility:hidden"><h1 class="jobs-unified-top-card__job-title">Hidden title</h1><div class="jobs-description-content__text">Hidden body</div></div>';
  document.querySelector('main').prepend(placeholders);
  await pause();
  for (const key of ['copy', 'export', 'mark']) assert(!button(key).disabled, key + ' enabled for h2 split detail with placeholders');
  assert(realDetail(document, 'https://www.linkedin.com/jobs/search/?currentJobId=123').job.title === 'Full-Stack Engineer', 'selected panel paired correctly');
  title.innerHTML = '<a href="https://www.linkedin.com/jobs/view/123/">Full-Stack Engineer</a>';
  assert(realDetail(document, 'https://www.linkedin.com/jobs/collections/recommended/').job.id === '123', 'direct title link without h1 or route ID');
  const wrapper = document.createElement('a'); wrapper.href = 'https://www.linkedin.com/jobs/view/999/';
  title.replaceWith(wrapper); wrapper.append(title); title.textContent = 'Old title';
  assert(realDetail(document, 'https://www.linkedin.com/jobs/search/?currentJobId=123') === null, 'ancestor title link mismatch rejected');
  wrapper.replaceWith(title); title.innerHTML = originalTitle; placeholders.remove(); await pause();
  assert(records[0].platform === 'linkedin' && records[0].lastViewedAt !== null, 'automatic view from explicit detail evidence');
  button('mark').click(); button('mark-SKIP').click(); await pause();
  assert(card.classList.contains('easyseek-hidden') && records[0].mark === 'SKIP', 'skip hides card');
  button('filter').click(); button('hideSkipped').click(); await pause(); assert(!card.classList.contains('easyseek-hidden'), 'filter restores');
  let copied = '', blob, filename;
  Object.defineProperty(navigator, 'clipboard', { value: { async writeText(value) { copied = value; } } });
  URL.createObjectURL = value => { blob = value; return 'blob:fixture'; };
  HTMLAnchorElement.prototype.click = function () { filename = this.download; };
  button('copy').click(); await pause(); button('export').click(); await pause();
  assert(copied.includes('LinkedIn Job ID') && copied.includes('Final paragraph') && copied.includes('https://www.linkedin.com/jobs/view/123/'), 'LinkedIn Markdown');
  assert(await blob.text() === copied && filename.endsWith('-123.md'), 'download handoff');
  const clone = card.cloneNode(true); clone.dataset.occludableJobId = '456'; clone.querySelector('a').href = 'https://www.linkedin.com/jobs/view/456/'; document.querySelector('#results').append(clone); await pause(); await pause();
  assert(S.getState(records, E.cards().get(clone)).mark === 'SKIP' && records[0].linkedinIds.includes('456'), 'dynamic aliases');
  const markTime = records[0].markChangedAt;
  history.pushState({}, '', '?id=999'); window.dispatchEvent(new PopStateEvent('popstate')); await pause();
  assert(button('copy').disabled && !records.some(record => record.linkedinIds.includes('999')), 'SPA loading old detail disabled');
  detail.dataset.jobId = '999'; detail.querySelector('h1 a').href = 'https://www.linkedin.com/jobs/view/999/'; detail.querySelector('h1 a').textContent = 'Different role'; detail.querySelector('#job-details').textContent = 'New role description'; await pause(); await pause();
  assert(!button('copy').disabled && records.some(record => record.linkedinIds.includes('999')), 'SPA loaded detail');
  assert(records.find(record => record.linkedinIds.includes('123')).markChangedAt === markTime, 'mark date unchanged');
  history.pushState({}, '', '?path=/feed/'); window.dispatchEvent(new PopStateEvent('popstate')); await pause(); assert(!document.querySelector('.easyseek-rail'), 'no rail on feed');
  history.pushState({}, '', '?path=/jobs/search/&id=999'); await new Promise(resolve => setTimeout(resolve, 1200));
  assert(document.querySelectorAll('.easyseek-rail').length === 1, 'feed to jobs SPA restored');
  // Public layout cards and details use different selectors.
  document.querySelector('main').innerHTML = '<ul><li class="base-card" data-entity-urn="urn:li:jobPosting:777"><a href="https://nz.linkedin.com/jobs/view/engineer-at-acme-777"></a><h3 class="base-search-card__title">Engineer</h3><h4 class="base-search-card__subtitle">Acme</h4><span class="job-search-card__location">Wellington</span></li></ul><section><h1 class="top-card-layout__title">Engineer</h1><a class="topcard__org-name-link">Acme</a><span class="topcard__flavor--bullet">Wellington</span><span class="posted-time-ago__text">3 days ago</span><div class="show-more-less-html__markup">Public full description</div></section>';
  assert(E.cards().size === 1, 'public card');
  const publicDetail = realDetail(document, 'https://nz.linkedin.com/jobs/view/engineer-at-acme-777');
  assert(publicDetail.job.company === 'Acme' && publicDetail.job.description === 'Public full description', 'public detail');
  assert(realDetail(document, 'https://www.linkedin.com/jobs/search/') === null, 'no active ID means no detail');
  document.querySelector('#report').textContent = 'PASS: LinkedIn cards, public/signed-in detail, stale guard, SPA/feed transitions, aliases, marks, filters, Markdown copy/export';
})().catch(error => document.querySelector('#report').textContent = 'FAIL: ' + error.stack);
</script></html>
